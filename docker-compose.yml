version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: funpay_postgres
    environment:
      POSTGRES_DB: funpay_db
      POSTGRES_USER: funpay_user
      POSTGRES_PASSWORD: funpay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funpay_user -d funpay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для кэша (опционально)
  redis:
    image: redis:7-alpine
    container_name: funpay_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: funpay_network
